            const existingIds = new Set(node.linksTo.map((l) => l.targetId));
            const myKanji = new Set(extractKanji(node.label));

            const candidates = [...sById.values()]
              .filter((other) => other.id !== node.id && !existingIds.has(other.id))
              .filter((other) => {
                if (!filterHira) return true;
                return (
                  other.label.toLowerCase().includes(filterHira) ||
                  toHiragana(other.reading).toLowerCase().includes(filterHira)
                );
              })
              .sort((a, b) => {
                const aShared = extractKanji(a.label).some((k) => myKanji.has(k)) ? 0 : 1;
                const bShared = extractKanji(b.label).some((k) => myKanji.has(k)) ? 0 : 1;
                return aShared - bShared;
              })
              .slice(0, 25);

            if (!candidates.length) {
              linkResultsBox.innerHTML = `<div style="padding: 6px; font-size: 11px; color: var(--text-muted);">候補なし</div>`;
              return;
            }

            linkResultsBox.innerHTML = candidates
              .map((c) => {
                const shared = extractKanji(c.label).some((k) => myKanji.has(k));
                return `
                  <div class="checklist-item" data-add-link-target="${c.id}">
                    <span><strong>${escapeHtml(c.label)}</strong> <span style="color: var(--text-muted); font-size: 11px;">${escapeHtml(c.reading)}</span></span>
                    <span style="font-size: 11px; color: var(--accent-primary); font-weight: 700;">${shared ? '同漢字 · ＋' : '＋'}</span>
                  </div>
                `;
              })
              .join('');

            linkResultsBox.querySelectorAll('[data-add-link-target]').forEach((row) => {
              row.addEventListener('click', () => {
                pushHistory();
                const targetId = row.dataset.addLinkTarget;
                const chosenType = document.getElementById('inspector-new-link-type')?.value || 'related';
                if (!node.linksTo.some((l) => l.targetId === targetId)) {
                  node.linksTo.push({ targetId, type: chosenType });
                }
                const other = sById.get(targetId);
                if (other && !other.linksTo.some((l) => l.targetId === node.id)) {
                  other.linksTo.push({ targetId: node.id, type: chosenType });
                }
                saveData();
                renderInspector();
                renderEdgesAndNodes();
              });
            });
          }

          if (linkSearchInput) {
            linkSearchInput.addEventListener('compositionstart', () => {
              isLinkSearchComposing = true;
            });
            linkSearchInput.addEventListener('compositionend', () => {
              isLinkSearchComposing = false;
              updateInspectorLinkResults();
            });
            linkSearchInput.addEventListener('input', (e) => {
              if (isLinkSearchComposing || e.isComposing) return;
              updateInspectorLinkResults();
            });
          }
          updateInspectorLinkResults();
        }

        // Shared Inspector Listeners (Color, Jump-to-Node, Delete Confirmation)
        elInspectorBody.querySelectorAll('[data-set-color]').forEach((btn) => {
          btn.addEventListener('click', () => {
            pushHistory();
            node.color = btn.dataset.setColor;
            saveData();
            renderInspector();
            renderEdgesAndNodes();
          });
        });

        document.getElementById('insp-color-picker')?.addEventListener('change', (e) => {
          pushHistory();
          node.color = e.target.value;
          saveData();
          renderInspector();
          renderEdgesAndNodes();
        });

        elInspectorBody.querySelectorAll('[data-jump-node]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const targetId = btn.dataset.jumpNode;
            selectNodeAndCenter(targetId);
          });
        });

        const delInit = document.getElementById('btn-delete-node-init');
        const delGroup = document.getElementById('delete-confirm-group');
        const delConfirm = document.getElementById('btn-delete-node-confirm');
        const delCancel = document.getElementById('btn-delete-node-cancel');

        delInit?.addEventListener('click', () => {
          delInit.style.display = 'none';
          delGroup.style.display = 'flex';
        });
        delCancel?.addEventListener('click', () => {
          delGroup.style.display = 'none';
          delInit.style.display = 'inline-flex';
        });
        delConfirm?.addEventListener('click', () => {
          deleteNode(node.id);
        });
      }

      function deleteNode(nodeId) {
        pushHistory();
        const idx = state.data.primaryNodes.findIndex((p) => p.id === nodeId);
        if (idx !== -1) {
          // Promote any owned secondary compounds that still have other parents
          const removedPrimary = state.data.primaryNodes[idx];
          const ownedSecondaries = removedPrimary.connections.filter((c) => c && c.id);
          state.data.primaryNodes.splice(idx, 1);

          for (const sec of ownedSecondaries) {
            const nextParent = state.data.primaryNodes.find((p) =>
              p.connections.some((c) => c.refId === sec.id)
            );
            if (nextParent) {
              nextParent.connections = nextParent.connections.filter((c) => c.refId !== sec.id);
              nextParent.connections.push(sec);
            }
          }
        } else {
          // Delete secondary compound and clean up all refId & linksTo pointers
          for (const p of state.data.primaryNodes) {
            p.connections = p.connections.filter(
              (c) => c.id !== nodeId && c.refId !== nodeId
            );
            for (const c of p.connections) {
              if (c && c.id && Array.isArray(c.linksTo)) {
                c.linksTo = c.linksTo.filter((l) => l.targetId !== nodeId);
              }
            }
          }
        }

        if (state.selectedId === nodeId) {
          state.selectedId = null;
        }
        saveData();
        renderAll();
        showToast(state.lang === 'en' ? 'Node deleted' : 'ノードを削除しました');
      }

      function selectNodeAndCenter(nodeId) {
        const { pById, sById } = buildGraphIndex();
        const target = pById.get(nodeId) || sById.get(nodeId);
        if (!target) return;
        state.selectedId = target.id;
        renderAll();
        focusCameraOnWorldPoint(target.x, target.y, 0.95);
      }

      function renderAll() {
        renderFilterBar();
        renderEdgesAndNodes();
        renderInspector();
      }

      // =====================================================================
      // POINTER INTERACTION: PAN, PINCH ZOOM, NODE DRAG & LINK MODE
      // =====================================================================
      let pointerMode = null; // 'pan' | 'drag' | 'pinch'
      let dragNode = null;
      let dragStartWorld = { x: 0, y: 0 };
      let dragMoved = false;
      let panStart = { x: 0, y: 0 };
      const activePointers = new Map();
      let initialPinchDist = 0;
      let initialPinchScale = 1;

      elCanvasContainer.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 2) {
          pointerMode = 'pinch';
          const pts = [...activePointers.values()];
          initialPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          initialPinchScale = state.camera.scale;
          return;
        }

        const nodeEl = e.target.closest('[data-node-id]');
        if (nodeEl) {
          const nid = nodeEl.dataset.nodeId;
          const { pById, sById } = buildGraphIndex();
          dragNode = pById.get(nid) || sById.get(nid);
          if (!dragNode) return;
          pointerMode = 'drag';
          dragMoved = false;
          dragStartWorld = {
            x: e.clientX / state.camera.scale - dragNode.x,
            y: e.clientY / state.camera.scale - dragNode.y
          };
          elCanvasContainer.setPointerCapture(e.pointerId);
        } else {
          pointerMode = 'pan';
          dragMoved = false;
          panStart = {
            x: e.clientX - state.camera.x,
            y: e.clientY - state.camera.y
          };
          elCanvasContainer.classList.add('grabbing');
          elCanvasContainer.setPointerCapture(e.pointerId);
        }
      });

      elCanvasContainer.addEventListener('pointermove', (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointerMode === 'pinch' && activePointers.size === 2) {
          const pts = [...activePointers.values()];
          const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          if (initialPinchDist > 10) {
            const midX = (pts[0].x + pts[1].x) / 2;
            const midY = (pts[0].y + pts[1].y) / 2 - 90;
            const newScale = Math.min(2.8, Math.max(0.2, initialPinchScale * (dist / initialPinchDist)));
            const ratio = newScale / state.camera.scale;
            state.camera.x = midX - (midX - state.camera.x) * ratio;
            state.camera.y = midY - (midY - state.camera.y) * ratio;
            state.camera.scale = newScale;
            applyCameraTransform(false);
          }
          return;
        }

        if (pointerMode === 'drag' && dragNode) {
          if (!dragMoved) {
            pushHistory();
            dragMoved = true;
          }
          dragNode.x = Math.round(e.clientX / state.camera.scale - dragStartWorld.x);
          dragNode.y = Math.round(e.clientY / state.camera.scale - dragStartWorld.y);
          renderEdgesAndNodes();
        } else if (pointerMode === 'pan') {
          const nx = e.clientX - panStart.x;
          const ny = e.clientY - panStart.y;
          if (Math.hypot(nx - state.camera.x, ny - state.camera.y) > 4) {
            dragMoved = true;
          }
          state.camera.x = nx;
          state.camera.y = ny;
          applyCameraTransform(false);
        }
      });

      function handleNodeTap(nid) {
        if (state.linkMode) {
          const { sById } = buildGraphIndex();
          if (!sById.has(nid)) {
            showToast(state.lang === 'en' ? 'Select a compound node to link' : '熟語ノードを選択してください');
            return;
          }
          if (!state.linkSourceId) {
            state.linkSourceId = nid;
            state.selectedId = nid;
            document.getElementById('link-mode-status').textContent =
              `「${sById.get(nid).label}」→ 2つ目の熟語を選択`;
            renderAll();
          } else if (state.linkSourceId !== nid) {
            pushHistory();
            const src = sById.get(state.linkSourceId);
            const dst = sById.get(nid);
            const ltype = state.activeLinkType;
            src.linksTo = src.linksTo.filter((l) => l.targetId !== dst.id);
            src.linksTo.push({ targetId: dst.id, type: ltype });
            dst.linksTo = dst.linksTo.filter((l) => l.targetId !== src.id);
            dst.linksTo.push({ targetId: src.id, type: ltype });
            saveData();
            state.linkSourceId = null;
            state.selectedId = dst.id;
            document.getElementById('link-mode-status').textContent = '1つ目の熟語を選択';
            renderAll();
            showToast(`${src.label} ↔ ${dst.label} を接続しました`);
          }
          return;
        }

        state.selectedId = state.selectedId === nid ? null : nid;
        renderAll();
      }

      function endPointer(e) {
        activePointers.delete(e.pointerId);
        elCanvasContainer.classList.remove('grabbing');

        if (pointerMode === 'drag' && dragNode) {
          if (dragMoved) {
            saveData();
          } else {
            handleNodeTap(dragNode.id);
          }
        } else if (pointerMode === 'pan' && !dragMoved) {
          if (state.selectedId) {
            state.selectedId = null;
            renderAll();
          }
        }

        if (activePointers.size === 0) {
          pointerMode = null;
          dragNode = null;
        }
      }

      elCanvasContainer.addEventListener('pointerup', endPointer);
      elCanvasContainer.addEventListener('pointercancel', endPointer);

      // Mouse wheel zoom centered on cursor
      elCanvasContainer.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          const rect = elCanvasContainer.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          const factor = e.deltaY < 0 ? 1.12 : 0.89;
          const newScale = Math.min(2.8, Math.max(0.2, state.camera.scale * factor));
          const ratio = newScale / state.camera.scale;
          state.camera.x = cx - (cx - state.camera.x) * ratio;
          state.camera.y = cy - (cy - state.camera.y) * ratio;
          state.camera.scale = newScale;
          applyCameraTransform(false);
        },
        { passive: false }
      );

      // =====================================================================
      // MODALS & TOOLBAR CONTROLS
      // =====================================================================
      function openModal(id) {
        document.getElementById(id)?.classList.add('open');
      }
      function closeModal(id) {
        document.getElementById(id)?.classList.remove('open');
      }

      document.querySelectorAll('[data-close-modal]').forEach((btn) => {
        btn.addEventListener('click', () => closeModal(btn.dataset.closeModal));
      });

      // Add Primary Kanji Modal
      document.getElementById('btn-open-add-primary').addEventListener('click', () => {
        document.getElementById('new-primary-label').value = '';
        document.getElementById('new-primary-onyomi').value = '';
        document.getElementById('new-primary-kunyomi').value = '';
        document.getElementById('new-primary-notes').value = '';
        openModal('modal-add-primary');
        setTimeout(() => document.getElementById('new-primary-label').focus(), 50);
      });

      document.getElementById('btn-confirm-add-primary').addEventListener('click', () => {
        const label = document.getElementById('new-primary-label').value.trim();
        if (!label) return;
        const { pByLabel } = buildGraphIndex();
        if (pByLabel.has(label)) {
          closeModal('modal-add-primary');
          selectNodeAndCenter(pByLabel.get(label).id);
          showToast(`「${label}」は既に登録されています`);
          return;
        }
        pushHistory();
        const center = getViewportCenterWorld();
        const pos = findFreePosition(center.x, center.y);
        const newPrimary = {
          id: genId('p'),
          label,
          onyomi: document.getElementById('new-primary-onyomi').value.trim(),
          kunyomi: document.getElementById('new-primary-kunyomi').value.trim(),
          color: '#3b82f6',
          x: pos.x,
          y: pos.y,
          notes: document.getElementById('new-primary-notes').value.trim(),
          connections: []
        };
        state.data.primaryNodes.push(newPrimary);
        if (state.autoLink) {
          reconcileAllNodes();
        }
        saveData();
        closeModal('modal-add-primary');
        selectNodeAndCenter(newPrimary.id);
        showToast(`親漢字「${label}」を追加しました`);
      });

      // Add Secondary Compound Modal
      let modalSelectedTags = new Set();
      function renderModalTagPills() {
        const wrap = document.getElementById('new-sec-tags');
        wrap.innerHTML = GRAMMAR_TAGS.map(
          (t) =>
            `<button type="button" class="tag-toggle ${modalSelectedTags.has(t.id) ? 'active' : ''}" data-mtag="${t.id}">${state.lang === 'en' ? t.en : t.ja}</button>`
        ).join('');
        wrap.querySelectorAll('[data-mtag]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.mtag;
            if (modalSelectedTags.has(id)) modalSelectedTags.delete(id);
            else modalSelectedTags.add(id);
            renderModalTagPills();
          });
        });
      }

      document.getElementById('new-sec-label').addEventListener('input', (e) => {
        const chars = extractKanji(e.target.value);
        const { pByLabel } = buildGraphIndex();
        const preview = document.getElementById('new-sec-kanji-preview');
        preview.innerHTML = chars
          .map((ch) => {
            const exists = pByLabel.has(ch);
            return `<span class="kanji-chip" style="font-size: 11px; padding: 2px 7px;">${escapeHtml(ch)} · ${exists ? '登録済' : '新規作成'}</span>`;
          })
          .join('');
      });

      document.getElementById('btn-open-add-secondary').addEventListener('click', () => {
        document.getElementById('new-sec-label').value = '';
        document.getElementById('new-sec-reading').value = '';
        document.getElementById('new-sec-notes').value = '';
        document.getElementById('new-sec-kanji-preview').innerHTML = '';
        modalSelectedTags = new Set();
        renderModalTagPills();
        openModal('modal-add-secondary');
        setTimeout(() => document.getElementById('new-sec-label').focus(), 50);
      });

      document.getElementById('btn-confirm-add-secondary').addEventListener('click', () => {
        const label = document.getElementById('new-sec-label').value.trim();
        if (!label) return;
        pushHistory();

        const newSec = {
          id: genId('s'),
          label,
          reading: document.getElementById('new-sec-reading').value.trim(),
          color: '#10b981',
          x: 0,
          y: 0,
          linksTo: [],
          tags: [...modalSelectedTags],
          notes: document.getElementById('new-sec-notes').value.trim()
        };

        const preferredPrimaryId = state.data.primaryNodes.some((p) => p.id === state.selectedId)
          ? state.selectedId
          : null;

        reconcileSecondaryNode(newSec, preferredPrimaryId);

        // If still unattached (e.g. kana-only word or autoLink off), attach to selected or first primary
        const { sOwner, pById, sParents } = buildGraphIndex();
        if (!sOwner.has(newSec.id)) {
          let fallbackPrimary =
            (preferredPrimaryId && pById.get(preferredPrimaryId)) ||
            state.data.primaryNodes[0];
          if (!fallbackPrimary) {
            const c = getViewportCenterWorld();
            fallbackPrimary = {
              id: genId('p'),
              label: [...label][0] || '語',
              onyomi: '',
              kunyomi: '',
              color: '#3b82f6',
              x: c.x,
              y: c.y,
              notes: '',
              connections: []
            };
            state.data.primaryNodes.push(fallbackPrimary);
          }
          fallbackPrimary.connections.push(newSec);
        }

        // Compute centroid placement from matched parents
        const updated = buildGraphIndex();
        const parents = (updated.sParents.get(newSec.id) || [])
          .map((pid) => updated.pById.get(pid))
          .filter(Boolean);
        const center = getViewportCenterWorld();
        const baseX = parents.length
          ? parents.reduce((acc, p) => acc + p.x, 0) / parents.length
          : center.x;
        const baseY = parents.length
          ? parents.reduce((acc, p) => acc + p.y, 0) / parents.length + (parents.length === 1 ? 110 : 0)
          : center.y;
        const pos = findFreePosition(baseX, baseY, newSec.id, 95);
        newSec.x = pos.x;
        newSec.y = pos.y;

        saveData();
        closeModal('modal-add-secondary');
        selectNodeAndCenter(newSec.id);
        showToast(`熟語「${label}」を追加しました`);
      });

      // Toolbar Toggles
      document.getElementById('btn-toggle-reveal').addEventListener('click', (e) => {
        state.revealAll = !state.revealAll;
        e.currentTarget.classList.toggle('active', state.revealAll);
        e.currentTarget.textContent = state.revealAll
          ? state.lang === 'en' ? 'Reveal All' : '全体表示'
          : state.lang === 'en' ? 'Focus Mode' : '集中表示';
        renderEdgesAndNodes();
      });

      document.getElementById('btn-toggle-readings').addEventListener('click', (e) => {
        state.showReadings = !state.showReadings;
        e.currentTarget.classList.toggle('active', state.showReadings);
        e.currentTarget.textContent = state.showReadings
          ? state.lang === 'en' ? 'Readings On' : '読み表示'
          : state.lang === 'en' ? 'Readings Off' : '読み非表示';
        renderEdgesAndNodes();
      });

      document.getElementById('btn-toggle-autolink').addEventListener('click', (e) => {
        state.autoLink = !state.autoLink;
        e.currentTarget.classList.toggle('active', state.autoLink);
      });

      document.getElementById('btn-toggle-autocreate').addEventListener('click', (e) => {
        state.autoCreatePrimary = !state.autoCreatePrimary;
        e.currentTarget.classList.toggle('active', state.autoCreatePrimary);
      });

      document.getElementById('btn-auto-arrange').addEventListener('click', autoArrangeClusters);
      document.getElementById('btn-undo').addEventListener('click', undo);
      document.getElementById('btn-redo').addEventListener('click', redo);

      // Link Mode Controls
      function renderLinkModeTypes() {
        const wrap = document.getElementById('link-mode-types');
        wrap.innerHTML = Object.entries(LINK_TYPES)
          .map(([k, meta]) => {
            const active = state.activeLinkType === k;
            return `<button type="button" class="link-type-chip ${active ? 'active' : ''}" data-lm-type="${k}" style="${active ? `background: ${meta.color};` : ''}">${meta.short}·${state.lang === 'en' ? meta.en : meta.ja}</button>`;
          })
          .join('');
        wrap.querySelectorAll('[data-lm-type]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.activeLinkType = btn.dataset.lmType;
            renderLinkModeTypes();
          });
        });
      }

      function setLinkMode(enabled) {
        state.linkMode = enabled;
        state.linkSourceId = null;
        document.getElementById('btn-toggle-link-mode').classList.toggle('link-active', enabled);
        const bar = document.getElementById('link-mode-bar');
        bar.classList.toggle('visible', enabled);
        if (enabled) {
          if (!state.revealAll) {
            state.revealAll = true;
            document.getElementById('btn-toggle-reveal').classList.add('active');
            document.getElementById('btn-toggle-reveal').textContent =
              state.lang === 'en' ? 'Reveal All' : '全体表示';
          }
          document.getElementById('link-mode-status').textContent = '1つ目の熟語を選択';
          renderLinkModeTypes();
          renderEdgesAndNodes();
        }
      }

      document.getElementById('btn-toggle-link-mode').addEventListener('click', () => {
        setLinkMode(!state.linkMode);
      });
      document.getElementById('btn-exit-link-mode').addEventListener('click', () => {
        setLinkMode(false);
      });

      // Map Search (IME-safe)
      bindImeSafeField(document.getElementById('map-search-input'), (val) => {
        state.searchQuery = val;
        renderEdgesAndNodes();
      });

      // Zoom Buttons
      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        state.camera.scale = Math.min(2.8, state.camera.scale * 1.2);
        applyCameraTransform(true);
      });
      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        state.camera.scale = Math.max(0.2, state.camera.scale * 0.82);
        applyCameraTransform(true);
      });
      document.getElementById('zoom-level-text').addEventListener('click', () => {
        const rect = elCanvasContainer.getBoundingClientRect();
        state.camera = { x: rect.width / 2, y: rect.height / 2, scale: 1 };
        applyCameraTransform(true);
      });
      document.getElementById('btn-zoom-fit').addEventListener('click', fitCameraToNodes);

      document.getElementById('btn-close-inspector').addEventListener('click', () => {
        state.selectedId = null;
        renderAll();
      });

      // JSON Modal Actions
      document.getElementById('btn-open-json').addEventListener('click', () => {
        document.getElementById('json-editor-textarea').value = JSON.stringify(state.data, null, 2);
        openModal('modal-json');
      });

      document.getElementById('btn-export-json').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        a.href = url;
        a.download = `kanji_nexus_${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('input-import-json-file').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            pushHistory();
            state.data = normalizeDataSchema(parsed);
            state.selectedId = null;
            saveData();
            closeModal('modal-json');
            renderAll();
            fitCameraToNodes();
            showToast('JSONファイルを読み込みました');
          } catch (err) {
            alert('JSONの解析に失敗しました: ' + err.message);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      document.getElementById('btn-apply-json-text').addEventListener('click', () => {
        try {
          const parsed = JSON.parse(document.getElementById('json-editor-textarea').value);
          pushHistory();
          state.data = normalizeDataSchema(parsed);
          state.selectedId = null;
          saveData();
          closeModal('modal-json');
          renderAll();
          showToast('JSONデータを適用しました');
        } catch (err) {
          alert('JSON構文エラー: ' + err.message);
        }
      });

      document.getElementById('btn-rescan-links').addEventListener('click', () => {
        pushHistory();
        reconcileAllNodes();
        saveData();
        document.getElementById('json-editor-textarea').value = JSON.stringify(state.data, null, 2);
        renderAll();
        showToast('全ノードの構成漢字・派生語リンクを再実行しました');
      });

      document.getElementById('btn-reset-starter').addEventListener('click', () => {
        pushHistory();
        state.data = normalizeDataSchema(STARTER_DATA);
        state.selectedId = null;
        saveData();
        closeModal('modal-json');
        renderAll();
        fitCameraToNodes();
        showToast('サンプルデータを読み込みました');
      });

      // Language & Theme Switchers
      function setLanguage(lang) {
        state.lang = lang === 'en' ? 'en' : 'ja';
        document.documentElement.setAttribute('data-lang', state.lang);
        try {
          localStorage.setItem(STORAGE_LANG_KEY, state.lang);
        } catch (_) {}
        document.getElementById('lang-ja-btn').classList.toggle('active', state.lang === 'ja');
        document.getElementById('lang-en-btn').classList.toggle('active', state.lang === 'en');
        if (window.NexusHub && typeof window.NexusHub.refreshUI === 'function') {
          window.NexusHub.refreshUI();
        }
        renderAll();

        document.querySelectorAll('.toolbar-scroll [data-ja]').forEach((el) => {
          el.textContent = state.lang === 'en' ? el.dataset.en : el.dataset.ja;
        });

        const revealBtn = document.getElementById('btn-toggle-reveal');
        if (revealBtn) {
          revealBtn.textContent = state.revealAll
            ? (state.lang === 'en' ? 'Reveal All' : '全体表示')
            : (state.lang === 'en' ? 'Focus Mode' : '集中表示');
        }

        const readingsBtn = document.getElementById('btn-toggle-readings');
        if (readingsBtn) {
          readingsBtn.textContent = state.showReadings
            ? (state.lang === 'en' ? 'Readings On' : '読み表示')
            : (state.lang === 'en' ? 'Readings Off' : '読み非表示');
        }

        const mapSearch = document.getElementById('map-search-input');
        if (mapSearch) {
          mapSearch.placeholder = state.lang === 'en'
            ? mapSearch.dataset.placeholderEn
            : mapSearch.dataset.placeholderJa;
        }
      }

      document.getElementById('lang-ja-btn').addEventListener('click', () => setLanguage('ja'));
      document.getElementById('lang-en-btn').addEventListener('click', () => setLanguage('en'));

      function setTheme(theme) {
        state.theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', state.theme);
        try {
          localStorage.setItem(STORAGE_THEME_KEY, state.theme);
        } catch (_) {}
        if (window.NexusHub && typeof window.NexusHub.refreshUI === 'function') {
          window.NexusHub.refreshUI();
        }
      }

      document.getElementById('btn-toggle-theme').addEventListener('click', () => {
        setTheme(state.theme === 'dark' ? 'light' : 'dark');
      });

      // Keyboard Shortcuts (Undo / Redo / Escape)
      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement?.tagName;
        const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
        if ((e.ctrlKey || e.metaKey) && !isTyping) {
          if (e.key.toLowerCase() === 'z' && !e.shiftKey) {
            e.preventDefault();
            undo();
          } else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) {
            e.preventDefault();
            redo();
          }
        } else if (e.key === 'Escape') {
          if (state.linkMode) setLinkMode(false);
          else if (state.selectedId) {
            state.selectedId = null;
            renderAll();
          }
        }
      });

      // Bilingual Hover & Mobile Long-Press Tooltips
      let longPressTimer = null;
      function showTooltipFor(target, clientX, clientY) {
        const el = target?.closest('[data-tip-ja], [data-tip-en]');
        if (!el) return;
        const text = state.lang === 'en' ? el.dataset.tipJa : el.dataset.tipEn;
        if (!text) return;
        elTooltip.textContent = text;
        elTooltip.classList.add('visible');
        const x = Math.min(window.innerWidth - 270, Math.max(8, clientX + 10));
        const y = Math.min(window.innerHeight - 36, Math.max(8, clientY + 14));
        elTooltip.style.left = `${x}px`;
        elTooltip.style.top = `${y}px`;
      }

      document.addEventListener('mouseover', (e) => {
        showTooltipFor(e.target, e.clientX, e.clientY);
      });
      document.addEventListener('mouseout', (e) => {
        if (e.target?.closest('[data-tip-ja], [data-tip-en]')) {
          elTooltip.classList.remove('visible');
        }
      });
      document.addEventListener(
        'touchstart',
        (e) => {
          const t = e.touches[0];
          if (!t) return;
          longPressTimer = setTimeout(() => showTooltipFor(e.target, t.clientX, t.clientY), 420);
        },
        { passive: true }
      );
      document.addEventListener('touchend', () => {
        clearTimeout(longPressTimer);
        setTimeout(() => elTooltip.classList.remove('visible'), 900);
      });

      // =====================================================================
      // INCOMING FOCUS & INITIALIZATION
      // =====================================================================
      function applyIncomingFocus() {
        const focusId =
          window.NexusHub && typeof window.NexusHub.consumeFocusId === 'function'
            ? window.NexusHub.consumeFocusId()
            : null;
        if (!focusId) return;

        state.searchQuery = '';
        state.activeTagFilter = 'all';
        document.getElementById('map-search-input').value = '';
        selectNodeAndCenter(focusId);
      }

      function init() {
        // Restore theme & language
        try {
          const savedTheme = localStorage.getItem(STORAGE_THEME_KEY);
          if (savedTheme === 'dark' || savedTheme === 'light') setTheme(savedTheme);
          const savedLang = localStorage.getItem(STORAGE_LANG_KEY);
          if (savedLang === 'en' || savedLang === 'ja') setLanguage(savedLang);
        } catch (_) {}

        // Load data via NexusHub bridge (handles both window.name & localStorage)
        const loaded =
          window.NexusHub && typeof window.NexusHub.getData === 'function'
            ? window.NexusHub.getData()
            : null;

        if (loaded && Array.isArray(loaded.primaryNodes) && loaded.primaryNodes.length > 0) {
          state.data = normalizeDataSchema(loaded);
        } else {
          state.data = normalizeDataSchema(STARTER_DATA);
          saveData();
        }

        // Flush state right before NexusHub navigates to another mini-app
        if (window.NexusHub) {
          window.NexusHub.onBeforeNavigate(() => saveData());
          window.NexusHub.onDataChange((updated) => {
            state.data = normalizeDataSchema(updated);
            renderAll();
          });
        }

        renderAll();
        fitCameraToNodes();
        applyIncomingFocus();

        window.addEventListener('hashchange', applyIncomingFocus);
        window.addEventListener('storage', (e) => {
          if (e.key === 'kanji_nexus_focus_id' && e.newValue) {
            applyIncomingFocus();
          }
        });
      }

      init();
    })();
  </script>
</body>
</html>
