<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>漢字ネットワーク | Kanji Nexus</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="漢字Nexus">
  <script>document.documentElement.dataset.theme = localStorage.getItem('kanji_nexus_theme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <script type="module" src="js/pages/map/main.js"></script>
</head>
<body>

  <header id="top-bar">
    <div class="brand-group">
      <img class="brand-badge" src="icon.svg" alt="">
      <span class="brand-title" data-tip-ja="漢字・熟語ネットワークマップ" data-tip-en="Kanji & Compound Network Map">漢字ネットワーク</span>
      <div id="nexus-hub-slot"></div>
    </div>

    <div class="toolbar-scroll">
      <button type="button" id="btn-open-add-primary" class="tb-btn primary" data-ja="＋ 漢字" data-en="＋ Kanji" data-tip-ja="新しい親漢字を追加" data-tip-en="Add Primary Kanji">＋ 漢字</button>
      <button type="button" id="btn-open-add-secondary" class="tb-btn secondary" data-ja="＋ 熟語" data-en="＋ Compound" data-tip-ja="新しい熟語を追加" data-tip-en="Add Compound">＋ 熟語</button>

      <div class="tb-divider"></div>

      <button type="button" id="btn-toggle-reveal" class="tb-btn" data-tip-ja="集中表示と全体表示を切替" data-tip-en="Toggle Focus Mode / Reveal All">集中表示</button>
      <button type="button" id="btn-toggle-readings" class="tb-btn" data-tip-ja="読み仮名の表示/非表示" data-tip-en="Show / Hide Readings">読み表示</button>
      <button type="button" id="btn-toggle-link-mode" class="tb-btn" data-ja="リンク接続" data-en="Link Mode" data-tip-ja="熟語同士の関連リンクを作成" data-tip-en="Interactive Compound Link Mode">リンク接続</button>
      <button type="button" id="btn-auto-arrange" class="tb-btn" data-ja="自動整列" data-en="Auto-Arrange" data-tip-ja="クラスター別に自動整列" data-tip-en="Auto-Arrange Clusters">自動整列</button>

      <div class="tb-divider"></div>

      <button type="button" id="btn-toggle-autolink" class="tb-btn" data-tip-ja="熟語追加時に派生語（例: 魅力↔魅力的）を自動リンク" data-tip-en="Auto-link derivatives (e.g. 魅力 ↔ 魅力的) when adding">自動リンク</button>
      <button type="button" id="btn-toggle-autocreate" class="tb-btn" data-tip-ja="熟語追加時に未登録の親漢字を自動作成" data-tip-en="Auto-create missing kanji when adding">未登録漢字自動作成</button>

      <div class="tb-divider"></div>

      <button type="button" id="btn-undo" class="tb-btn" disabled data-ja="↩ 戻す" data-en="↩ Undo" data-tip-ja="操作を元に戻す (Ctrl+Z)" data-tip-en="Undo (Ctrl+Z)">↩ 戻す</button>
      <button type="button" id="btn-redo" class="tb-btn" disabled data-ja="↪ やり直す" data-en="↪ Redo" data-tip-ja="操作をやり直す (Ctrl+Y)" data-tip-en="Redo (Ctrl+Y)">↪ やり直す</button>

      <div class="tb-divider"></div>

      <input type="search" id="map-search-input" placeholder="漢字・読み検索..." data-placeholder-ja="漢字・読み検索..." data-placeholder-en="Search kanji / reading..." data-tip-ja="漢字・熟語・読みで検索" data-tip-en="Search Kanji / Reading">
    </div>

    <div id="nexus-hub-controls"></div>

    <!-- Phones: compact actions (the toolbar above is hidden) -->
    <div class="mobile-actions">
      <button type="button" id="m-btn-search" class="icon-btn" aria-label="検索 / Search">🔍</button>
      <button type="button" id="m-btn-undo" class="icon-btn" aria-label="戻す / Undo" disabled>↩</button>
      <button type="button" id="m-btn-tools" class="icon-btn" aria-label="表示・ツール / View & tools">⚙︎</button>
    </div>
  </header>

  <div id="m-search" hidden>
    <div class="m-search-bar">
      <input type="search" id="m-search-input" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
        data-placeholder-ja="漢字・熟語・読みで検索" data-placeholder-en="Search kanji, words, readings">
      <button type="button" id="m-search-close" class="tb-btn" data-ja="閉じる" data-en="Close">閉じる</button>
    </div>
    <div id="m-search-results" class="m-search-results"></div>
  </div>

  <div id="tag-filter-bar">
    <div class="filter-pills" id="tag-filter-pills"></div>
    <div class="map-stats-pill" id="map-stats-summary"></div>
  </div>

  <main id="canvas-container">
    <div id="world">
      <svg id="edges-svg" viewBox="-10000 -10000 20000 20000">
        <g id="edges-primary-layer"></g>
        <g id="edges-lateral-layer"></g>
      </svg>
      <div id="nodes-layer"></div>
    </div>
  </main>

  <div id="link-mode-bar">
    <span class="link-mode-title" data-ja="🔗 リンク接続モード:" data-en="🔗 Link mode:">🔗 リンク接続モード:</span>
    <span id="link-mode-status"></span>
    <div id="link-mode-types" class="chip-row"></div>
    <button type="button" id="btn-exit-link-mode" class="tb-btn small" data-ja="終了 (Esc)" data-en="Exit (Esc)">終了 (Esc)</button>
  </div>

  <div id="zoom-controls">
    <button type="button" id="btn-zoom-out" class="zoom-btn" data-tip-ja="縮小" data-tip-en="Zoom Out">−</button>
    <span id="zoom-level-text" data-tip-ja="100%にリセット" data-tip-en="Reset Zoom to 100%">100%</span>
    <button type="button" id="btn-zoom-in" class="zoom-btn" data-tip-ja="拡大" data-tip-en="Zoom In">＋</button>
    <button type="button" id="btn-zoom-fit" class="zoom-btn wide" data-ja="全体" data-en="Fit" data-tip-ja="全体を表示" data-tip-en="Fit All Nodes">全体</button>
  </div>

  <div id="fab-wrap">
    <div id="fab-menu" hidden>
      <button type="button" class="fab-option" data-fab="word" data-ja="＋ 熟語・語彙" data-en="＋ Word">＋ 熟語・語彙</button>
      <button type="button" class="fab-option" data-fab="kanji" data-ja="＋ 親漢字" data-en="＋ Kanji">＋ 親漢字</button>
    </div>
    <button type="button" id="fab" aria-label="追加 / Add">＋</button>
  </div>

  <div class="modal-backdrop" id="modal-map-tools">
    <div class="modal-card">
      <div class="modal-title">
        <span data-ja="表示・ツール" data-en="View & tools">表示・ツール</span>
        <button type="button" class="tb-btn" data-close-modal="modal-map-tools">✕</button>
      </div>
      <div class="menu-list" id="map-tools-list"></div>
    </div>
  </div>

  <aside id="inspector-panel" aria-label="Node Inspector">
    <div class="inspector-header">
      <span class="sheet-grab" aria-hidden="true"></span>
      <span class="inspector-badge" id="inspector-type-badge"></span>
      <button type="button" id="btn-close-inspector" class="tb-btn small">✕</button>
    </div>
    <div class="inspector-body" id="inspector-body"></div>
  </aside>

  <div class="modal-backdrop" id="modal-add-primary">
    <div class="modal-card">
      <div class="modal-title">
        <span data-ja="＋ 親漢字を追加" data-en="＋ Add Primary Kanji">＋ 親漢字を追加</span>
        <button type="button" class="tb-btn" data-close-modal="modal-add-primary">✕</button>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="漢字 (1文字)" data-en="Kanji (1 character)">漢字 (1文字)</label>
        <input type="text" id="new-primary-label" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" maxlength="4" placeholder="例: 構" data-placeholder-ja="例: 構" data-placeholder-en="e.g. 構">
      </div>
      <div class="field-grid-2">
        <div class="field-group">
          <label class="field-label" data-ja="音読み" data-en="Onyomi">音読み</label>
          <input type="text" id="new-primary-onyomi" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: コウ" data-placeholder-ja="例: コウ" data-placeholder-en="e.g. コウ">
        </div>
        <div class="field-group">
          <label class="field-label" data-ja="訓読み" data-en="Kunyomi">訓読み</label>
          <input type="text" id="new-primary-kunyomi" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: かま.える" data-placeholder-ja="例: かま.える" data-placeholder-en="e.g. かま.える">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="メモ" data-en="Notes">メモ</label>
        <input type="text" id="new-primary-notes" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="任意の学習メモ" data-placeholder-ja="任意の学習メモ" data-placeholder-en="Optional study notes">
      </div>
      <div class="modal-actions">
        <button type="button" class="tb-btn" data-close-modal="modal-add-primary" data-ja="キャンセル" data-en="Cancel">キャンセル</button>
        <button type="button" id="btn-confirm-add-primary" class="tb-btn primary" data-ja="追加する" data-en="Add">追加する</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-add-secondary">
    <div class="modal-card">
      <div class="modal-title">
        <span data-ja="＋ 熟語・語彙を追加" data-en="＋ Add Compound / Word">＋ 熟語・語彙を追加</span>
        <button type="button" class="tb-btn" data-close-modal="modal-add-secondary">✕</button>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="熟語・単語" data-en="Compound / word">熟語・単語</label>
        <input type="text" id="new-sec-label" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: 構造" data-placeholder-ja="例: 構造" data-placeholder-en="e.g. 構造">
        <div id="new-sec-kanji-preview" class="chip-row"></div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="読み (ひらがな)" data-en="Reading (hiragana)">読み (ひらがな)</label>
        <input type="text" id="new-sec-reading" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: こうぞう" data-placeholder-ja="例: こうぞう" data-placeholder-en="e.g. こうぞう">
        <div id="new-sec-reading-hint" class="field-hint" hidden></div>
      </div>
      <div class="field-group">
        <label class="field-label"><span data-ja="意味" data-en="Meaning">意味</span><span id="dict-status" class="field-hint dict-status"></span></label>
        <input type="text" id="new-sec-meaning" class="field-input" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-placeholder-ja="辞書から自動入力・自由に編集" data-placeholder-en="Filled from the dictionary — edit freely">
        <div id="dict-candidates" class="chip-row"></div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="品詞・用法タグ" data-en="Grammar & usage tags">品詞・用法タグ</label>
        <div id="new-sec-tags" class="chip-row"></div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="メモ" data-en="Notes">メモ</label>
        <input type="text" id="new-sec-notes" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="意味・例文・ニュアンス" data-placeholder-ja="意味・例文・ニュアンス" data-placeholder-en="Meaning, example, nuance">
      </div>
      <div class="modal-actions">
        <button type="button" class="tb-btn" data-close-modal="modal-add-secondary" data-ja="キャンセル" data-en="Cancel">キャンセル</button>
        <button type="button" id="btn-confirm-add-secondary" class="tb-btn secondary" data-ja="追加する" data-en="Add">追加する</button>
      </div>
    </div>
  </div>

</body>
</html>
