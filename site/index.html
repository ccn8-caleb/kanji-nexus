<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>漢字ネクサス | Kanji Nexus</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="漢字ネクサス">
  <script>document.documentElement.dataset.theme = localStorage.getItem('kanji_nexus_theme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <script type="module" src="js/pages/map/main.js"></script>
</head>
<body>

  <header id="top-bar">
    <div class="brand-group">
      <img class="brand-badge" src="icon.svg" alt="">
      <span class="brand-title" data-ja="漢字ネクサス" data-en="Kanji Nexus" data-tip-ja="漢字と熟語をつなぐ学習マップ" data-tip-en="Map, analyze and drill kanji">漢字ネクサス</span>
      <div id="nexus-hub-slot"></div>
    </div>

    <!-- Desktop & tablet: search, one Add button, undo/redo, one View menu -->
    <div class="map-actions">
      <label class="search-field" data-tip-ja="漢字・熟語・読み・意味で検索（/）" data-tip-en="Search kanji, words, readings, meanings (/)">
        <span data-icon="search"></span>
        <input type="search" id="map-search-input" autocomplete="off" spellcheck="false"
          data-placeholder-ja="検索（漢字・読み・意味）" data-placeholder-en="Search kanji, readings, meanings">
      </label>
      <button type="button" id="btn-add-menu" class="tb-btn primary" data-menu-anchor aria-haspopup="menu"
        data-tip-ja="熟語・漢字を追加（N / K）" data-tip-en="Add a word or kanji (N / K)">
        <span data-icon="add"></span><span data-ja="追加" data-en="Add">追加</span><span data-icon="chevronDown" class="caret"></span>
      </button>
      <div class="btn-group">
        <button type="button" id="btn-undo" class="icon-btn" disabled aria-label="Undo" data-tip-ja="元に戻す（Ctrl+Z）" data-tip-en="Undo (Ctrl+Z)"><span data-icon="undo"></span></button>
        <button type="button" id="btn-redo" class="icon-btn" disabled aria-label="Redo" data-tip-ja="やり直す（Ctrl+Y）" data-tip-en="Redo (Ctrl+Y)"><span data-icon="redo"></span></button>
      </div>
      <button type="button" id="btn-view-menu" class="icon-btn" data-menu-anchor aria-haspopup="menu" aria-label="View"
        data-tip-ja="表示・ツール" data-tip-en="View & tools"><span data-icon="tools"></span></button>
    </div>

    <div id="nexus-hub-controls"></div>

    <!-- Phones -->
    <div class="mobile-actions">
      <button type="button" id="m-btn-search" class="icon-btn" aria-label="検索 / Search"><span data-icon="search"></span></button>
      <button type="button" id="m-btn-undo" class="icon-btn" aria-label="戻す / Undo" disabled><span data-icon="undo"></span></button>
      <button type="button" id="m-btn-tools" class="icon-btn" aria-label="表示・ツール / View & tools"><span data-icon="tools"></span></button>
    </div>
  </header>

  <div id="m-search" hidden>
    <div class="m-search-bar">
      <input type="search" id="m-search-input" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
        data-placeholder-ja="漢字・熟語・読みで検索" data-placeholder-en="Search kanji, words, readings">
      <button type="button" id="m-search-close" class="tb-btn" data-ja="閉じる" data-en="Close">閉じる</button>
    </div>
    <div id="m-search-results" class="m-search-results"></div>
  </div>

  <div id="tag-filter-bar">
    <div class="filter-pills" id="tag-filter-pills"></div>
    <div class="map-stats-pill" id="map-stats-summary"></div>
  </div>

  <main id="canvas-container">
    <div id="world">
      <svg id="edges-svg" viewBox="-10000 -10000 20000 20000">
        <g id="edges-primary-layer"></g>
        <g id="edges-lateral-layer"></g>
      </svg>
      <div id="nodes-layer"></div>
    </div>
  </main>

  <div id="link-mode-bar">
    <span class="link-mode-title"><span data-icon="link"></span><span data-ja="リンク接続モード" data-en="Link mode">リンク接続モード</span></span>
    <span id="link-mode-status"></span>
    <div id="link-mode-types" class="chip-row"></div>
    <button type="button" id="btn-exit-link-mode" class="tb-btn small" data-ja="終了 (Esc)" data-en="Exit (Esc)">終了 (Esc)</button>
  </div>

  <div id="zoom-controls">
    <button type="button" id="btn-zoom-out" class="zoom-btn" aria-label="Zoom out" data-tip-ja="縮小" data-tip-en="Zoom Out"><span data-icon="zoomOut"></span></button>
    <span id="zoom-level-text" data-tip-ja="100%にリセット" data-tip-en="Reset Zoom to 100%">100%</span>
    <button type="button" id="btn-zoom-in" class="zoom-btn" aria-label="Zoom in" data-tip-ja="拡大" data-tip-en="Zoom In"><span data-icon="zoomIn"></span></button>
    <button type="button" id="btn-zoom-fit" class="zoom-btn" aria-label="Fit" data-tip-ja="全体を表示" data-tip-en="Fit All Nodes"><span data-icon="fit"></span></button>
  </div>

  <div id="fab-wrap">
    <div id="fab-menu" hidden>
      <button type="button" class="fab-option" data-fab="word"><span data-icon="add"></span><span data-ja="熟語・語彙" data-en="Word">熟語・語彙</span></button>
      <button type="button" class="fab-option" data-fab="kanji"><span data-icon="add"></span><span data-ja="親漢字" data-en="Kanji">親漢字</span></button>
    </div>
    <button type="button" id="fab" aria-label="追加 / Add"><span data-icon="add"></span></button>
  </div>

  <div class="modal-backdrop" id="modal-map-tools">
    <div class="modal-card">
      <div class="modal-title">
        <span data-ja="表示・ツール" data-en="View & tools">表示・ツール</span>
        <button type="button" class="icon-btn small" data-close-modal="modal-map-tools" aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="menu-list" id="map-tools-list"></div>
    </div>
  </div>

  <aside id="inspector-panel" aria-label="Node Inspector">
    <div class="inspector-header">
      <span class="sheet-grab" aria-hidden="true"></span>
      <span class="inspector-badge" id="inspector-type-badge"></span>
      <button type="button" id="btn-close-inspector" class="icon-btn small" aria-label="Close"><span data-icon="close"></span></button>
    </div>
    <div class="inspector-body" id="inspector-body"></div>
  </aside>

  <div class="modal-backdrop" id="modal-add-primary">
    <div class="modal-card">
      <div class="modal-title">
        <span data-ja="親漢字を追加" data-en="Add kanji">親漢字を追加</span>
        <button type="button" class="icon-btn small" data-close-modal="modal-add-primary" aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="added-list" id="kanji-added-list" hidden></div>
      <div class="field-group">
        <label class="field-label" data-ja="漢字 (1文字)" data-en="Kanji (1 character)">漢字 (1文字)</label>
        <input type="text" id="new-primary-label" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" maxlength="4" placeholder="例: 構" data-placeholder-ja="例: 構" data-placeholder-en="e.g. 構">
      </div>
      <div class="field-grid-2">
        <div class="field-group">
          <label class="field-label" data-ja="音読み" data-en="Onyomi">音読み</label>
          <input type="text" id="new-primary-onyomi" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: コウ" data-placeholder-ja="コウ（スペース2回で・）" data-placeholder-en="コウ (double space → ・)">
        </div>
        <div class="field-group">
          <label class="field-label" data-ja="訓読み" data-en="Kunyomi">訓読み</label>
          <input type="text" id="new-primary-kunyomi" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: かま.える" data-placeholder-ja="かま.える（スペース2回で・）" data-placeholder-en="かま.える (double space → ・)">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="メモ" data-en="Notes">メモ</label>
        <input type="text" id="new-primary-notes" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="任意の学習メモ" data-placeholder-ja="任意の学習メモ" data-placeholder-en="Optional study notes">
      </div>
      <div class="modal-actions">
        <span class="form-status" id="kanji-form-status" role="status"></span>
        <button type="button" class="tb-btn" data-close-modal="modal-add-primary" data-ja="完了" data-en="Done">完了</button>
        <button type="button" id="btn-confirm-add-primary" class="tb-btn primary"><span data-ja="追加" data-en="Add">追加</span><kbd class="key-hint">Enter</kbd></button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-add-secondary">
    <div class="modal-card">
      <div class="modal-title">
        <span data-ja="熟語・語彙を追加" data-en="Add words">熟語・語彙を追加</span>
        <button type="button" class="icon-btn small" data-close-modal="modal-add-secondary" aria-label="Close"><span data-icon="close"></span></button>
      </div>
      <div class="added-list" id="word-added-list" hidden></div>
      <div class="field-group">
        <label class="field-label" data-ja="熟語・単語" data-en="Compound / word">熟語・単語</label>
        <input type="text" id="new-sec-label" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: 構造" data-placeholder-ja="例: 構造" data-placeholder-en="e.g. 構造">
        <div id="new-sec-kanji-preview" class="chip-row"></div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="読み (ひらがな)" data-en="Reading (hiragana)">読み (ひらがな)</label>
        <input type="text" id="new-sec-reading" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="例: こうぞう" data-placeholder-ja="こうぞう（ローマ字でも可）" data-placeholder-en="こうぞう (romaji works too)">
        <div id="new-sec-reading-hint" class="field-hint" hidden></div>
      </div>
      <div class="field-group">
        <label class="field-label"><span data-ja="意味" data-en="Meaning">意味</span><span id="dict-status" class="field-hint dict-status"></span></label>
        <input type="text" id="new-sec-meaning" class="field-input" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-placeholder-ja="辞書から自動入力・自由に編集" data-placeholder-en="Filled from the dictionary — edit freely">
        <div id="dict-candidates" class="chip-row"></div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="品詞・用法タグ" data-en="Grammar & usage tags">品詞・用法タグ</label>
        <div id="new-sec-tags" class="chip-row"></div>
      </div>
      <div class="field-group">
        <label class="field-label" data-ja="メモ" data-en="Notes">メモ</label>
        <input type="text" id="new-sec-notes" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="field-input" placeholder="意味・例文・ニュアンス" data-placeholder-ja="意味・例文・ニュアンス" data-placeholder-en="Meaning, example, nuance">
      </div>
      <div class="modal-actions">
        <span class="form-status" id="word-form-status" role="status"></span>
        <button type="button" class="tb-btn" data-close-modal="modal-add-secondary" data-ja="完了" data-en="Done">完了</button>
        <button type="button" id="btn-confirm-add-secondary" class="tb-btn secondary"><span data-ja="追加" data-en="Add">追加</span><kbd class="key-hint">Enter</kbd></button>
      </div>
    </div>
  </div>

</body>
</html>
