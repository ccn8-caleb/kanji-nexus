<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>復習ドリル | Kanji Nexus</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <script>document.documentElement.dataset.theme = localStorage.getItem('kanji_nexus_theme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/drill.css">
  <script type="module" src="js/pages/drill.js"></script>
</head>
<body>

  <header id="top-bar">
    <div class="brand-group">
      <img class="brand-badge" src="icon.svg" alt="">
      <span class="brand-title" data-tip-ja="間隔反復フラッシュカード練習" data-tip-en="Spaced Repetition Flashcard Drill">復習ドリル</span>
      <div id="nexus-hub-slot"></div>
    </div>
    <div class="header-actions">
      <button type="button" id="btn-reset-srs" class="tb-btn" data-tip-ja="学習履歴をリセット" data-tip-en="Reset SRS Progress">↺</button>
      <div id="nexus-hub-controls"></div>
    </div>
  </header>

  <main class="container">
    <section class="status-grid" id="srs-status-grid"></section>

    <section class="controls-card">
      <div class="controls-row">
        <div class="seg-group">
          <button type="button" class="seg-btn" data-deck-type="all" data-ja="すべて" data-en="All">すべて</button>
          <button type="button" class="seg-btn" data-deck-type="word" data-ja="熟語・語彙" data-en="Compounds">熟語・語彙</button>
          <button type="button" class="seg-btn" data-deck-type="kanji" data-ja="親漢字" data-en="Primary Kanji">親漢字</button>
        </div>
        <div class="seg-group">
          <button type="button" class="seg-btn" data-dir="kanji-to-reading" data-ja="漢字 → 読み" data-en="Kanji → Reading">漢字 → 読み</button>
          <button type="button" class="seg-btn" data-dir="reading-to-kanji" data-ja="読み → 漢字" data-en="Reading → Kanji">読み → 漢字</button>
        </div>
        <button type="button" id="btn-toggle-cram" class="tb-btn" data-tip-ja="期限外も含めて全カードを練習" data-tip-en="Practice All Cards (Ignore Due Date)"></button>
      </div>

      <div class="tag-filter-row" id="drill-tag-pills"></div>

      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="session-progress-fill"></div></div>
        <span class="progress-text" id="session-progress-text"></span>
      </div>
    </section>

    <section id="card-stage"></section>
  </main>

</body>
</html>
