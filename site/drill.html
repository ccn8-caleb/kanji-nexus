<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>復習ドリル | Kanji Nexus</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="漢字ネクサス">
  <script>document.documentElement.dataset.theme = localStorage.getItem('kanji_nexus_theme') === 'dark' ? 'dark' : 'light';</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/drill.css">
  <script type="module" src="js/pages/drill.js"></script>
</head>
<body>

  <header id="top-bar">
    <div class="brand-group">
      <img class="brand-badge" src="icon.svg" alt="">
      <span class="brand-title" data-ja="漢字ネクサス" data-en="Kanji Nexus" data-tip-ja="漢字と熟語をつなぐ学習マップ" data-tip-en="Map, analyze and drill kanji">漢字ネクサス</span>
      <div id="nexus-hub-slot"></div>
    </div>
    <div class="header-actions">
      <button type="button" id="btn-reset-srs" class="icon-btn" data-tip-ja="学習履歴をリセット" data-tip-en="Reset SRS Progress"><span data-icon="reset"></span></button>
      <div id="nexus-hub-controls"></div>
    </div>
  </header>

  <main class="container">
    <section class="status-grid" id="srs-status-grid"></section>

    <details class="controls-card" id="drill-controls">
      <summary class="controls-summary"><span id="controls-summary-text"></span><span class="controls-chevron" data-icon="chevronDown"></span></summary>
      <div class="controls-body">
      <div class="controls-row">
        <div class="seg-group" data-tip-ja="同じ語は複数のマップにあっても1枚のカード" data-tip-en="A word in several maps is still one card">
          <button type="button" class="seg-btn" data-scope="map" data-ja="このマップ" data-en="This map">このマップ</button>
          <button type="button" class="seg-btn" data-scope="all" data-ja="全マップ" data-en="All maps">全マップ</button>
        </div>
        <div class="seg-group">
          <button type="button" class="seg-btn" data-deck-type="all" data-ja="すべて" data-en="All">すべて</button>
          <button type="button" class="seg-btn" data-deck-type="word" data-ja="熟語・語彙" data-en="Compounds">熟語・語彙</button>
          <button type="button" class="seg-btn" data-deck-type="kanji" data-ja="親漢字" data-en="Primary Kanji">親漢字</button>
        </div>
        <div class="seg-group">
          <button type="button" class="seg-btn" data-dir="kanji-to-reading" data-ja="漢字 → 読み" data-en="Kanji → Reading">漢字 → 読み</button>
          <button type="button" class="seg-btn" data-dir="reading-to-kanji" data-ja="読み → 漢字" data-en="Reading → Kanji">読み → 漢字</button>
        </div>
        <button type="button" id="btn-toggle-cram" class="tb-btn" data-tip-ja="期限外も含めて全カードを練習" data-tip-en="Practice All Cards (Ignore Due Date)"></button>
      </div>

      <div class="tag-filter-row" id="drill-tag-pills"></div>
      </div>
    </details>

    <section class="progress-card">
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="session-progress-fill"></div></div>
        <span class="progress-text" id="session-progress-text"></span>
      </div>
    </section>

    <section id="card-stage"></section>
  </main>

</body>
</html>
