<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>復習ドリル | Kanji Nexus SRS Drill</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f172a'/%3E%3Cpath d='M27 33 L48 17 M27 36 L49 47' stroke='%2364748b' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='48' cy='17' r='7' fill='%233b82f6' stroke='%230f172a' stroke-width='2'/%3E%3Ccircle cx='49' cy='47' r='6.5' fill='%2310b981' stroke='%230f172a' stroke-width='2'/%3E%3Ctext x='23' y='45' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='34' fill='%23f8fafc'%3E%E6%BC%A2%3C/text%3E%3C/svg%3E">
  <!-- Shared Hotbar Loader & Cross-App Data Bridge -->
  <script src="nexus-hub.js"></script>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-surface: #ffffff;
      --bg-elevated: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-primary: #2563eb;
      --accent-secondary: #10b981;
      --accent-purple: #8b5cf6;
      --accent-amber: #f59e0b;
      --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.07);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 16px 38px rgba(15, 23, 42, 0.14);
    }

    [data-theme="dark"] {
      --bg-page: #0b1120;
      --bg-surface: #0f172a;
      --bg-elevated: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent-primary: #3b82f6;
      --accent-secondary: #10b981;
      --accent-purple: #a78bfa;
      --accent-amber: #fbbf24;
      --danger: #f87171;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 38px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      padding-top: 56px;
    }

    /* ================= TOP BAR ================= */
    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 10px;
      z-index: 1000;
      box-shadow: var(--shadow-sm);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-badge {
      width: 24px;
      height: 24px;
      min-width: 24px;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-badge img {
      width: 24px;
      height: 24px;
      display: block;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tb-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .tb-btn:hover {
      background: var(--bg-elevated);
    }
    .tb-btn.active {
      background: rgba(37, 99, 235, 0.12);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    .lang-switch button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      cursor: pointer;
    }
    .lang-switch button.active {
      background: var(--accent-primary);
      color: #ffffff;
    }

    /* ================= LAYOUT ================= */
    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 56px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ================= SRS STATUS STRIP ================= */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 640px) {
      .status-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .stat-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 11px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .stat-num {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.15;
    }

    /* ================= DECK CONTROLS ================= */
    .controls-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .seg-group {
      display: inline-flex;
      background: var(--bg-elevated);
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border-color);
      gap: 2px;
      flex-wrap: wrap;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .tag-filter-row {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .tag-filter-row::-webkit-scrollbar {
      display: none;
    }

    .tag-pill {
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-elevated);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .tag-pill.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
    }

    /* ================= PROGRESS BAR ================= */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: var(--bg-elevated);
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      transition: width 0.25s ease;
      width: 0%;
    }

    .progress-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ================= FLASHCARD STAGE ================= */
    .flashcard {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: var(--shadow-lg);
      min-height: 360px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      position: relative;
      transition: border-color 0.2s;
    }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .type-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .type-badge.primary {
      background: rgba(37, 99, 235, 0.12);
      color: var(--accent-primary);
    }
    .type-badge.secondary {
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent-secondary);
    }

    .srs-state-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-muted);
    }

    .jump-map-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.35);
      background: rgba(37, 99, 235, 0.08);
      color: var(--accent-primary);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .jump-map-btn:hover {
      background: rgba(37, 99, 235, 0.18);
    }

    .card-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 12px 0;
      cursor: pointer;
      user-select: none;
    }

    .prompt-hero {
      font-size: clamp(42px, 8vw, 68px);
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1.15;
      color: var(--text-main);
    }

    .prompt-reading-hero {
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 800;
      color: var(--accent-primary);
      line-height: 1.25;
    }

    .prompt-mask {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--text-muted);
      background: var(--bg-elevated);
      padding: 6px 18px;
      border-radius: 12px;
      border: 1.5px dashed var(--border-color);
    }

    .prompt-sub {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 520px;
    }

    .flip-hint {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ================= CARD BACK DETAILS ================= */
    .answer-divider {
      height: 1px;
      background: var(--border-color);
      width: 100%;
    }

    .answer-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .answer-main-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 4px;
    }

    .answer-reading {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .answer-kanji-reveal {
      font-size: 36px;
      font-weight: 900;
      color: var(--text-main);
    }

    .answer-note {
      background: var(--bg-elevated);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-main);
      text-align: center;
    }

    .context-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .context-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .context-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .ctx-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .ctx-chip:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* ================= RATING BUTTONS ================= */
    .reveal-btn-full {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      background: var(--accent-primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: filter 0.15s;
    }
    .reveal-btn-full:hover {
      filter: brightness(1.08);
    }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    @media (max-width: 540px) {
      .rating-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .rate-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 10px 8px;
      border-radius: 11px;
      border: 1.5px solid transparent;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, filter 0.15s;
    }
    .rate-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
    .rate-btn .rate-title {
      font-size: 13px;
      font-weight: 800;
    }
    .rate-btn .rate-int {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.88;
    }

    .rate-again {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--danger);
    }
    .rate-hard {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.4);
      color: #d97706;
    }
    [data-theme="dark"] .rate-hard {
      color: #fbbf24;
    }
    .rate-good {
      background: rgba(16, 185, 129, 0.13);
      border-color: rgba(16, 185, 129, 0.45);
      color: var(--accent-secondary);
    }
    .rate-easy {
      background: rgba(37, 99, 235, 0.12);
      border-color: rgba(37, 99, 235, 0.4);
      color: var(--accent-primary);
    }

    /* ================= COMPLETION STATE ================= */
    .done-state {
      text-align: center;
      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .done-icon {
      font-size: 46px;
    }

    .done-title {
      font-size: 20px;
      font-weight: 800;
    }

    .done-sub {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 440px;
    }

    .done-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }

    .primary-pill-btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent-primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    #bilingual-tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.94);
      color: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 6px;
      box-shadow: var(--shadow-md);
      z-index: 5000;
      opacity: 0;
      transition: opacity 0.12s;
      max-width: 260px;
      white-space: nowrap;
    }
    #bilingual-tooltip.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header id="top-bar">
    <div class="brand-group">
      <div class="brand-badge">
        <img id="brand-icon-img" alt="復習ドリル">
      </div>
      <span class="brand-title" data-tip-ja="間隔反復フラッシュカード練習" data-tip-en="Spaced Repetition Flashcard Drill">復習ドリル</span>
      <!-- Shared Hotbar Mount Point (populated automatically by nexus-hub.js) -->
      <div id="nexus-hub-slot"></div>
    </div>

    <div class="header-actions">
      <button type="button" id="btn-reset-srs" class="tb-btn" data-tip-ja="学習履歴をリセット" data-tip-en="Reset SRS Progress">↺</button>

      <div class="lang-switch" data-tip-ja="表示言語切替" data-tip-en="Switch Language">
        <button type="button" id="lang-ja-btn" class="active">日本語</button>
        <button type="button" id="lang-en-btn">EN</button>
      </div>

      <button type="button" id="btn-toggle-theme" class="tb-btn" data-tip-ja="テーマ切替" data-tip-en="Toggle Theme">🌓</button>
    </div>
  </header>

  <main class="container">
    <!-- SRS SUMMARY STATS -->
    <section class="status-grid" id="srs-status-grid"></section>

    <!-- DECK & MODE CONTROLS -->
    <section class="controls-card">
      <div class="controls-row">
        <div class="seg-group" id="deck-type-tabs">
          <button type="button" class="seg-btn active" data-deck-type="all">すべて</button>
          <button type="button" class="seg-btn" data-deck-type="secondary">熟語・語彙</button>
          <button type="button" class="seg-btn" data-deck-type="primary">親漢字</button>
        </div>

        <div class="seg-group" id="prompt-dir-tabs">
          <button type="button" class="seg-btn active" data-dir="kanji-to-reading">漢字 → 読み</button>
          <button type="button" class="seg-btn" data-dir="reading-to-kanji">読み → 漢字</button>
        </div>

        <button type="button" id="btn-toggle-cram" class="tb-btn" data-tip-ja="期限外も含めて全カードを練習" data-tip-en="Practice All Cards (Ignore Due Date)">全カード練習</button>
      </div>

      <div class="tag-filter-row" id="drill-tag-pills"></div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="session-progress-fill"></div>
        </div>
        <span class="progress-text" id="session-progress-text">0 / 0</span>
      </div>
    </section>

    <!-- FLASHCARD STAGE -->
    <section id="card-stage"></section>
  </main>

  <div id="bilingual-tooltip"></div>

  <script>
    (function () {
      'use strict';

      const brandImg = document.getElementById('brand-icon-img');
      if (brandImg) {
        brandImg.src = document.querySelector('link[rel~="icon"]')?.href || '';
      }

      const SRS_STORAGE_KEY = 'kanji_nexus_srs_v1';
      const DAY_MS = 24 * 60 * 60 * 1000;

      const GRAMMAR_TAGS = [
        { id: 'suru', ja: 'する動', en: 'Suru-verb' },
        { id: 'intransitive', ja: '自動', en: 'Intransitive' },
        { id: 'transitive', ja: '他動', en: 'Transitive' },
        { id: 'na-adj', ja: 'な形', en: 'Na-adj' },
        { id: 'i-adj', ja: 'い形', en: 'I-adj' },
        { id: 'adverb', ja: '副', en: 'Adverb' },
        { id: 'kana', ja: 'かな表記', en: 'Usually Kana' }
      ];

      const LINK_TYPES = {
        related:    { ja: '関連語', en: 'Related',    short: '関', color: '#64748b' },
        antonym:    { ja: '対義語', en: 'Antonym',    short: '対', color: '#f43f5e' },
        synonym:    { ja: '類義語', en: 'Synonym',    short: '類', color: '#0ea5e9' },
        derivative: { ja: '派生語', en: 'Derivative', short: '派', color: '#10b981' },
        lookalike:  { ja: '類形語', en: 'Lookalike',  short: '似', color: '#f59e0b' }
      };

      const state = {
        data: { primaryNodes: [] },
        srs: {},               // { [nodeId]: { reps, interval, ease, due, lapses } }
        deckType: 'all',       // 'all' | 'secondary' | 'primary'
        direction: 'kanji-to-reading', // 'kanji-to-reading' | 'reading-to-kanji'
        tagFilter: 'all',
        practiceAll: false,
        queue: [],
        completedInSession: 0,
        flipped: false,
        lang: 'ja',
        theme: 'light'
      };

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function loadSrsStore() {
        try {
          const raw = localStorage.getItem(SRS_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
              state.srs = parsed;
            }
          }
        } catch (_) {}
      }

      function saveSrsStore() {
        try {
          localStorage.setItem(SRS_STORAGE_KEY, JSON.stringify(state.srs));
        } catch (_) {}
      }

      // =====================================================================
      // SM-2 SPACED REPETITION SCHEDULER
      // =====================================================================
      function getCardRecord(id) {
        return (
          state.srs[id] || {
            reps: 0,
            interval: 0,
            ease: 2.5,
            due: 0,
            lapses: 0
          }
        );
      }

      function computeNextSm2(record, quality) {
        // quality: 1 = Again, 2 = Hard, 3 = Good, 4 = Easy
        let { reps, interval, ease, lapses } = record;
        const now = Date.now();

        if (quality === 1) {
          reps = 0;
          interval = 0;
          lapses = (lapses || 0) + 1;
          ease = Math.max(1.3, ease - 0.2);
          return { reps, interval, ease, lapses, due: now };
        }

        if (reps === 0) {
          interval = quality === 2 ? 1 : quality === 3 ? 1 : 4;
        } else if (reps === 1) {
          interval = quality === 2 ? 2 : quality === 3 ? 6 : 8;
        } else {
          const mult = quality === 2 ? 1.2 : quality === 3 ? ease : ease * 1.3;
          interval = Math.max(interval + 1, Math.round(interval * mult));
        }

        if (quality === 2) ease = Math.max(1.3, ease - 0.15);
        if (quality === 4) ease = ease + 0.15;

        reps += 1;
        return {
          reps,
          interval,
          ease: Number(ease.toFixed(2)),
          lapses: lapses || 0,
          due: now + interval * DAY_MS
        };
      }

      function formatIntervalLabel(days, isEn) {
        if (days <= 0) return isEn ? '< 1 min' : 'すぐ再出題';
        if (days === 1) return isEn ? '1 day' : '1日後';
        return isEn ? `${days} days` : `${days}日後`;
      }

      // =====================================================================
      // DECK EXTRACTION & QUEUE BUILDING
      // =====================================================================
      function buildGraphLookup() {
        const primaries = Array.isArray(state.data?.primaryNodes) ? state.data.primaryNodes : [];
        const pById = new Map();
        const sById = new Map();
        const sParents = new Map();

        for (const p of primaries) {
          pById.set(p.id, p);
          for (const c of p.connections || []) {
            if (c && c.id) {
              sById.set(c.id, c);
              if (!sParents.has(c.id)) sParents.set(c.id, []);
              if (!sParents.get(c.id).includes(p.id)) sParents.get(c.id).push(p.id);
            } else if (c && c.refId) {
              if (!sParents.has(c.refId)) sParents.set(c.refId, []);
              if (!sParents.get(c.refId).includes(p.id)) sParents.get(c.refId).push(p.id);
            }
          }
        }
        return { primaries, pById, sById, sParents };
      }

      function getAllCards(lookup = buildGraphLookup()) {
        const { primaries, sById } = lookup;
        const cards = [];

        for (const p of primaries) {
          // Only include primary kanji in reading->kanji if it has at least one reading
          cards.push({
            id: p.id,
            kind: 'primary',
            label: p.label,
            reading: [p.onyomi, p.kunyomi].filter(Boolean).join(' / '),
            onyomi: p.onyomi || '',
            kunyomi: p.kunyomi || '',
            tags: [],
            notes: p.notes || '',
            color: p.color || '#3b82f6'
          });
        }

        for (const s of sById.values()) {
          cards.push({
            id: s.id,
            kind: 'secondary',
            label: s.label,
            reading: s.reading || '',
            tags: Array.isArray(s.tags) ? s.tags : [],
            notes: s.notes || '',
            linksTo: Array.isArray(s.linksTo) ? s.linksTo : [],
            color: s.color || '#10b981'
          });
        }

        return cards;
      }

      function rebuildQueue() {
        const lookup = buildGraphLookup();
        const all = getAllCards(lookup);
        const now = Date.now();

        const filtered = all.filter((card) => {
          if (state.deckType !== 'all' && card.kind !== state.deckType) return false;
          if (state.tagFilter !== 'all') {
            if (card.kind !== 'secondary' || !card.tags.includes(state.tagFilter)) return false;
          }
          if (state.direction === 'reading-to-kanji' && !card.reading) {
            return false;
          }
          if (!state.practiceAll) {
            const rec = getCardRecord(card.id);
            if (rec.reps > 0 && rec.due > now) return false;
          }
          return true;
        });

        // Sort: due reviews first, then new cards shuffled lightly
        const dueCards = [];
        const newCards = [];
        for (const c of filtered) {
          const rec = getCardRecord(c.id);
          if (rec.reps > 0) dueCards.push(c);
          else newCards.push(c);
        }

        dueCards.sort((a, b) => getCardRecord(a.id).due - getCardRecord(b.id).due);
        for (let i = newCards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [newCards[i], newCards[j]] = [newCards[j], newCards[i]];
        }

        state.queue = [...dueCards, ...newCards];
        state.completedInSession = 0;
        state.flipped = false;
      }

      // =====================================================================
      // RENDERING
      // =====================================================================
      function renderStatusGrid() {
        const all = getAllCards();
        const now = Date.now();
        const isEn = state.lang === 'en';

        let dueCount = 0;
        let newCount = 0;
        let learningCount = 0;
        let masteredCount = 0;

        for (const c of all) {
          const rec = getCardRecord(c.id);
          if (rec.reps === 0) {
            newCount++;
            dueCount++;
          } else {
            if (rec.due <= now) dueCount++;
            if (rec.interval >= 7) masteredCount++;
            else learningCount++;
          }
        }

        document.getElementById('srs-status-grid').innerHTML = `
          <div class="stat-box">
            <span class="stat-label">${isEn ? 'Due Today' : '本日の復習予定'}</span>
            <span class="stat-num" style="color: var(--accent-primary);">${dueCount}</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">${isEn ? 'New Cards' : '未学習カード'}</span>
            <span class="stat-num" style="color: var(--accent-purple);">${newCount}</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">${isEn ? 'Learning' : '学習中'}</span>
            <span class="stat-num" style="color: var(--accent-amber);">${learningCount}</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">${isEn ? 'Mastered (7d+)' : '定着済 (7日以上)'}</span>
            <span class="stat-num" style="color: var(--accent-secondary);">${masteredCount}</span>
          </div>
        `;
      }

      function renderControls() {
        const isEn = state.lang === 'en';

        document.querySelectorAll('[data-deck-type]').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.deckType === state.deckType);
          const t = btn.dataset.deckType;
          if (t === 'all') btn.textContent = isEn ? 'All' : 'すべて';
          if (t === 'secondary') btn.textContent = isEn ? 'Compounds' : '熟語・語彙';
          if (t === 'primary') btn.textContent = isEn ? 'Primary Kanji' : '親漢字';
        });

        document.querySelectorAll('[data-dir]').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.dir === state.direction);
          const d = btn.dataset.dir;
          if (d === 'kanji-to-reading') btn.textContent = isEn ? 'Kanji → Reading' : '漢字 → 読み';
          if (d === 'reading-to-kanji') btn.textContent = isEn ? 'Reading → Kanji' : '読み → 漢字';
        });

        const cramBtn = document.getElementById('btn-toggle-cram');
        cramBtn.classList.toggle('active', state.practiceAll);
        cramBtn.textContent = state.practiceAll
          ? isEn ? 'Practice All: ON' : '全カード練習中'
          : isEn ? 'Practice All' : '全カード練習';

        const tagRow = document.getElementById('drill-tag-pills');
        const allPill = `<button type="button" class="tag-pill ${state.tagFilter === 'all' ? 'active' : ''}" data-dtag="all">${isEn ? 'All Tags' : '全品詞'}</button>`;
        const pills = GRAMMAR_TAGS.map(
          (t) =>
            `<button type="button" class="tag-pill ${state.tagFilter === t.id ? 'active' : ''}" data-dtag="${t.id}">${isEn ? t.en : t.ja}</button>`
        ).join('');
        tagRow.innerHTML = allPill + pills;

        tagRow.querySelectorAll('[data-dtag]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.tagFilter = btn.dataset.dtag;
            if (state.tagFilter !== 'all' && state.deckType === 'primary') {
              state.deckType = 'secondary';
            }
            rebuildQueue();
            renderAll();
          });
        });

        const totalSession = state.completedInSession + state.queue.length;
        const pct = totalSession > 0 ? Math.round((state.completedInSession / totalSession) * 100) : 100;
        document.getElementById('session-progress-fill').style.width = `${pct}%`;
        document.getElementById('session-progress-text').textContent = isEn
          ? `${state.completedInSession} / ${totalSession} done`
          : `${state.completedInSession} / ${totalSession} 完了`;
      }

      function getDictionaryLinks(card) {
        const q = encodeURIComponent(card.label);
        if (card.kind === 'primary') {
          return [
            { name: '漢字ペディア', url: `https://www.kanjipedia.jp/search?k=${q}&kt=1&sk=leftHand` },
            { name: 'Weblio漢字', url: `https://www.weblio.jp/content/${q}` },
            { name: 'Jisho', url: `https://jisho.org/search/${q}%20%23kanji` }
          ];
        }
        return [
          { name: 'Weblio国語', url: `https://www.weblio.jp/content/${q}` },
          { name: 'コトバンク', url: `https://kotobank.jp/gs/?q=${q}` },
          { name: 'Jisho', url: `https://jisho.org/search/${q}` }
        ];
      }

      function renderCardStage() {
        const stage = document.getElementById('card-stage');
        const isEn = state.lang === 'en';
        const lookup = buildGraphLookup();

        if (!state.queue.length) {
          const allCards = getAllCards(lookup);
          stage.innerHTML = `
            <div class="flashcard">
              <div class="done-state">
                <div class="done-icon">🎉</div>
                <div class="done-title">${
                  allCards.length === 0
                    ? isEn ? 'No Kanji or Vocabulary Found' : 'カードデータがありません'
                    : isEn ? 'Session Complete!' : '本日の復習が完了しました！'
                }</div>
                <div class="done-sub">${
                  allCards.length === 0
                    ? isEn
                      ? 'Add kanji or compounds in the Map view first, and they will appear here automatically.'
                      : '先に「マップ」で漢字や熟語を追加すると、自動的にここに表示されます。'
                    : isEn
                      ? 'All scheduled cards in this filter are up to date. You can review all cards ahead of schedule or inspect your network in the Map.'
                      : 'この条件の復習予定カードはすべて完了しました。全カード練習モードで追加練習するか、マップでネットワークを確認できます。'
                }</div>
                <div class="done-actions">
                  ${
                    allCards.length > 0 && !state.practiceAll
                      ? `<button type="button" id="btn-start-cram-now" class="primary-pill-btn">${isEn ? 'Practice All Cards Anyway' : '全カード練習を始める'}</button>`
                      : ''
                  }
                  <button type="button" id="btn-go-map-empty" class="tb-btn">${isEn ? 'Open Map ↗' : 'マップを開く ↗'}</button>
                </div>
              </div>
            </div>
          `;

          document.getElementById('btn-start-cram-now')?.addEventListener('click', () => {
            state.practiceAll = true;
            rebuildQueue();
            renderAll();
          });
          document.getElementById('btn-go-map-empty')?.addEventListener('click', () => {
            if (window.NexusHub) window.NexusHub.navigate('map');
          });
          return;
        }

        const card = state.queue[0];
        const rec = getCardRecord(card.id);
        const srsStatusLabel =
          rec.reps === 0
            ? isEn ? 'New' : '未学習'
            : rec.interval >= 7
              ? isEn ? `Mastered (${rec.interval}d)` : `定着 (${rec.interval}日)`
              : isEn ? `Learning (${rec.interval}d)` : `学習中 (${rec.interval}日)`;

        const tagChips = (card.tags || [])
          .map((tid) => {
            const meta = GRAMMAR_TAGS.find((t) => t.id === tid);
            return meta
              ? `<span class="srs-state-badge" style="color: var(--accent-secondary);">${isEn ? meta.en : meta.ja}</span>`
              : '';
          })
          .join('');

        // Front content depending on direction
        let frontHtml = '';
        if (state.direction === 'kanji-to-reading') {
          frontHtml = `
            <div class="prompt-hero">${escapeHtml(card.label)}</div>
            ${tagChips ? `<div class="chip-list" style="justify-content: center;">${tagChips}</div>` : ''}
            ${!state.flipped ? `<div class="flip-hint">${isEn ? 'Tap card or press Space to reveal answer' : 'カードをタップ または Spaceキーで答えを表示'}</div>` : ''}
          `;
        } else {
          const maskStr = [...card.label].map((ch) => (/\p{Script=Han}/u.test(ch) ? '〇' : ch)).join('');
          frontHtml = `
            <div class="prompt-reading-hero">${escapeHtml(card.reading || '—')}</div>
            <div class="prompt-mask">${escapeHtml(maskStr)}</div>
            ${tagChips ? `<div class="chip-list" style="justify-content: center;">${tagChips}</div>` : ''}
            ${card.notes ? `<div class="prompt-sub">${escapeHtml(card.notes)}</div>` : ''}
            ${!state.flipped ? `<div class="flip-hint">${isEn ? 'Tap card or press Space to reveal kanji' : 'カードをタップ または Spaceキーで漢字を表示'}</div>` : ''}
          `;
        }

        // Back content when flipped
        let backHtml = '';
        if (state.flipped) {
          const contextBoxes = [];

          if (card.kind === 'secondary') {
            const parents = (lookup.sParents.get(card.id) || [])
              .map((pid) => lookup.pById.get(pid))
              .filter(Boolean);
            if (parents.length) {
              contextBoxes.push(`
                <div class="context-box">
                  <div class="context-title">${isEn ? 'Constituent Kanji (Click for Map)' : '構成親漢字 (クリックでマップ)'}</div>
                  <div class="chip-list">
                    ${parents
                      .map(
                        (p) =>
                          `<button type="button" class="ctx-chip" data-jump-id="${p.id}">${escapeHtml(p.label)} <span style="font-weight:400;color:var(--text-muted);">${escapeHtml(p.onyomi || p.kunyomi)}</span></button>`
                      )
                      .join('')}
                  </div>
                </div>
              `);
            }

            const linked = (card.linksTo || [])
              .map((l) => {
                const tid = typeof l === 'string' ? l : l.targetId;
                const ltype = typeof l === 'object' && l.type ? l.type : 'related';
                const target = lookup.sById.get(tid);
                const meta = LINK_TYPES[ltype] || LINK_TYPES.related;
                return target ? { target, meta } : null;
              })
              .filter(Boolean);

            if (linked.length) {
              contextBoxes.push(`
                <div class="context-box">
                  <div class="context-title">${isEn ? 'Related Compounds' : '関連語リンク'}</div>
                  <div class="chip-list">
                    ${linked
                      .map(
                        ({ target, meta }) =>
                          `<button type="button" class="ctx-chip" style="border-color:${meta.color};" data-jump-id="${target.id}">${meta.short}·${escapeHtml(target.label)}</button>`
                      )
                      .join('')}
                  </div>
                </div>
              `);
            }
          } else {
            const primaryObj = lookup.pById.get(card.id);
            const attached = (primaryObj?.connections || [])
              .map((c) => lookup.sById.get(c.id || c.refId))
              .filter(Boolean);
            if (attached.length) {
              contextBoxes.push(`
                <div class="context-box">
                  <div class="context-title">${isEn ? `Connected Compounds (${attached.length})` : `関連する熟語 (${attached.length})`}</div>
                  <div class="chip-list">
                    ${attached
                      .slice(0, 8)
                      .map(
                        (s) =>
                          `<button type="button" class="ctx-chip" data-jump-id="${s.id}">${escapeHtml(s.label)} <span style="font-weight:400;color:var(--text-muted);">${escapeHtml(s.reading)}</span></button>`
                      )
                      .join('')}
                  </div>
                </div>
              `);
            }
          }

          const dictLinks = getDictionaryLinks(card)
            .map(
              (d) =>
                `<a class="ctx-chip" href="${d.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(d.name)} ↗</a>`
            )
            .join('');

          contextBoxes.push(`
            <div class="context-box">
              <div class="context-title">${isEn ? 'Dictionary Lookup' : '外部辞書'}</div>
              <div class="chip-list">${dictLinks}</div>
            </div>
          `);

          const revealHeader =
            state.direction === 'kanji-to-reading'
              ? `<div class="answer-reading">${escapeHtml(card.reading || (isEn ? 'No reading saved' : '読み未登録'))}</div>`
              : `<div class="answer-kanji-reveal">${escapeHtml(card.label)}</div>`;

          backHtml = `
            <div class="answer-divider"></div>
            <div class="answer-panel">
              <div class="answer-main-row">
                ${revealHeader}
                ${card.notes && state.direction === 'kanji-to-reading' ? `<div class="answer-note">${escapeHtml(card.notes)}</div>` : ''}
              </div>
              <div class="context-grid">${contextBoxes.join('')}</div>
            </div>
          `;
        }

        // Bottom action buttons
        let footerHtml = '';
        if (!state.flipped) {
          footerHtml = `
            <button type="button" id="btn-flip-card" class="reveal-btn-full">
              ${isEn ? 'Show Answer (Space)' : '答えを表示する (Space)'}
            </button>
          `;
        } else {
          const intAgain = formatIntervalLabel(computeNextSm2(rec, 1).interval, isEn);
          const intHard = formatIntervalLabel(computeNextSm2(rec, 2).interval, isEn);
          const intGood = formatIntervalLabel(computeNextSm2(rec, 3).interval, isEn);
          const intEasy = formatIntervalLabel(computeNextSm2(rec, 4).interval, isEn);

          footerHtml = `
            <div class="rating-grid">
              <button type="button" class="rate-btn rate-again" data-rate="1">
                <span class="rate-title">1 · ${isEn ? 'Again' : 'もう一度'}</span>
                <span class="rate-int">${intAgain}</span>
              </button>
              <button type="button" class="rate-btn rate-hard" data-rate="2">
                <span class="rate-title">2 · ${isEn ? 'Hard' : '難しい'}</span>
                <span class="rate-int">${intHard}</span>
              </button>
              <button type="button" class="rate-btn rate-good" data-rate="3">
                <span class="rate-title">3 · ${isEn ? 'Good' : '正解'}</span>
                <span class="rate-int">${intGood}</span>
              </button>
              <button type="button" class="rate-btn rate-easy" data-rate="4">
                <span class="rate-title">4 · ${isEn ? 'Easy' : '簡単'}</span>
                <span class="rate-int">${intEasy}</span>
              </button>
            </div>
          `;
        }

        stage.innerHTML = `
          <div class="flashcard">
            <div class="card-top-meta">
              <div class="card-badges">
                <span class="type-badge ${card.kind}">${
                  card.kind === 'primary'
                    ? isEn ? 'Primary Kanji' : '親漢字'
                    : isEn ? 'Compound / Vocab' : '熟語・語彙'
                }</span>
                <span class="srs-state-badge">${srsStatusLabel}</span>
              </div>
              <button type="button" class="jump-map-btn" data-jump-id="${card.id}">
                ${isEn ? 'View in Map ↗' : 'マップで確認 ↗'}
              </button>
            </div>

            <div class="card-center" id="card-tap-surface">
              ${frontHtml}
            </div>

            ${backHtml}
            ${footerHtml}
          </div>
        `;

        document.getElementById('card-tap-surface')?.addEventListener('click', () => {
          if (!state.flipped) {
            state.flipped = true;
            renderCardStage();
          }
        });

        document.getElementById('btn-flip-card')?.addEventListener('click', () => {
          state.flipped = true;
          renderCardStage();
        });

        stage.querySelectorAll('[data-rate]').forEach((btn) => {
          btn.addEventListener('click', () => {
            rateCurrentCard(Number(btn.dataset.rate));
          });
        });

        stage.querySelectorAll('[data-jump-id]').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.dataset.jumpId;
            if (window.NexusHub && typeof window.NexusHub.openInMap === 'function') {
              window.NexusHub.openInMap(id);
            } else {
              window.location.href = `kanji_nexus.html?focus=${encodeURIComponent(id)}`;
            }
          });
        });
      }

      function rateCurrentCard(quality) {
        if (!state.queue.length) return;
        const current = state.queue.shift();
        const prevRec = getCardRecord(current.id);
        const nextRec = computeNextSm2(prevRec, quality);
        state.srs[current.id] = nextRec;
        saveSrsStore();

        if (quality === 1) {
          // Re-insert 2 cards later (or at end) so the user practices it again this session
          const insertIdx = Math.min(2, state.queue.length);
          state.queue.splice(insertIdx, 0, current);
        } else {
          state.completedInSession++;
        }

        state.flipped = false;
        renderAll();
      }

      function renderAll() {
        renderStatusGrid();
        renderControls();
        renderCardStage();
      }

      // =====================================================================
      // EVENTS & KEYBOARD SHORTCUTS
      // =====================================================================
      document.querySelectorAll('[data-deck-type]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.deckType = btn.dataset.deckType;
          rebuildQueue();
          renderAll();
        });
      });

      document.querySelectorAll('[data-dir]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.direction = btn.dataset.dir;
          rebuildQueue();
          renderAll();
        });
      });

      document.getElementById('btn-toggle-cram').addEventListener('click', () => {
        state.practiceAll = !state.practiceAll;
        rebuildQueue();
        renderAll();
      });

      document.getElementById('btn-reset-srs').addEventListener('click', () => {
        const msg =
          state.lang === 'en'
            ? 'Reset all spaced-repetition review progress?'
            : '復習ドリルの学習履歴をすべてリセットしますか？';
        if (!confirm(msg)) return;
        state.srs = {};
        saveSrsStore();
        rebuildQueue();
        renderAll();
      });

      document.addEventListener('keydown', (e) => {
        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (!state.queue.length) return;

        if (e.code === 'Space' || e.key === 'Enter') {
          if (!state.flipped) {
            e.preventDefault();
            state.flipped = true;
            renderCardStage();
          }
        } else if (state.flipped && ['1', '2', '3', '4'].includes(e.key)) {
          e.preventDefault();
          rateCurrentCard(Number(e.key));
        }
      });

      function setLanguage(lang) {
        state.lang = lang === 'en' ? 'en' : 'ja';
        document.documentElement.setAttribute('data-lang', state.lang);
        try {
          localStorage.setItem('kanji_nexus_lang', state.lang);
        } catch (_) {}
        document.getElementById('lang-ja-btn').classList.toggle('active', state.lang === 'ja');
        document.getElementById('lang-en-btn').classList.toggle('active', state.lang === 'en');
        if (window.NexusHub && typeof window.NexusHub.refreshUI === 'function') {
          window.NexusHub.refreshUI();
        }
        renderAll();
      }

      document.getElementById('lang-ja-btn').addEventListener('click', () => setLanguage('ja'));
      document.getElementById('lang-en-btn').addEventListener('click', () => setLanguage('en'));

      function setTheme(theme) {
        state.theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', state.theme);
        try {
          localStorage.setItem('kanji_nexus_theme', state.theme);
        } catch (_) {}
        if (window.NexusHub && typeof window.NexusHub.refreshUI === 'function') {
          window.NexusHub.refreshUI();
        }
      }

      document.getElementById('btn-toggle-theme').addEventListener('click', () => {
        setTheme(state.theme === 'dark' ? 'light' : 'dark');
      });

      // Bilingual Hover & Long-Press Tooltips
      const elTooltip = document.getElementById('bilingual-tooltip');
      let longPressTimer = null;
      function showTooltipFor(target, clientX, clientY) {
        const el = target?.closest('[data-tip-ja], [data-tip-en]');
        if (!el) return;
        const text = state.lang === 'en' ? el.dataset.tipJa : el.dataset.tipEn;
        if (!text) return;
        elTooltip.textContent = text;
        elTooltip.classList.add('visible');
        elTooltip.style.left = `${Math.min(window.innerWidth - 270, Math.max(8, clientX + 10))}px`;
        elTooltip.style.top = `${Math.min(window.innerHeight - 36, Math.max(8, clientY + 14))}px`;
      }
      document.addEventListener('mouseover', (e) => showTooltipFor(e.target, e.clientX, e.clientY));
      document.addEventListener('mouseout', (e) => {
        if (e.target?.closest('[data-tip-ja], [data-tip-en]')) elTooltip.classList.remove('visible');
      });
      document.addEventListener(
        'touchstart',
        (e) => {
          const t = e.touches[0];
          if (!t) return;
          longPressTimer = setTimeout(() => showTooltipFor(e.target, t.clientX, t.clientY), 420);
        },
        { passive: true }
      );
      document.addEventListener('touchend', () => {
        clearTimeout(longPressTimer);
        setTimeout(() => elTooltip.classList.remove('visible'), 900);
      });

      function init() {
        try {
          const savedTheme = localStorage.getItem('kanji_nexus_theme');
          if (savedTheme === 'dark' || savedTheme === 'light') setTheme(savedTheme);
          const savedLang = localStorage.getItem('kanji_nexus_lang');
          if (savedLang === 'en' || savedLang === 'ja') setLanguage(savedLang);
        } catch (_) {}

        loadSrsStore();

        const loaded =
          window.NexusHub && typeof window.NexusHub.getData === 'function'
            ? window.NexusHub.getData()
            : null;
        if (loaded && Array.isArray(loaded.primaryNodes)) {
          state.data = loaded;
        }

        if (window.NexusHub && typeof window.NexusHub.onDataChange === 'function') {
          window.NexusHub.onDataChange((updated) => {
            state.data = updated;
            rebuildQueue();
            renderAll();
          });
        }

        rebuildQueue();
        renderAll();
      }

      init();
    })();
  </script>
</body>
</html>
